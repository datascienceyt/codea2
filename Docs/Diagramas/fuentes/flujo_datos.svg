<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="Arial, Helvetica, sans-serif"><defs><marker id="a1E4466" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1E4466"/></marker><marker id="aF28C28" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F28C28"/></marker><marker id="a5B6675" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5B6675"/></marker><marker id="a2E8B4E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2E8B4E"/></marker></defs><rect width="1200" height="520" fill="#FFFFFF"/><text x="600.0" y="44" font-size="30" font-weight="700" fill="#1E4466" text-anchor="middle">Camino de los datos de una sesión</text><rect x="30" y="70" width="755" height="420" rx="14" fill="none" stroke="#5B6675" stroke-width="2" stroke-dasharray="8 6"/><text x="46" y="96" font-size="18" font-weight="700" fill="#5B6675" text-anchor="start">En el visor (funciona sin conexión)</text><rect x="50" y="120" width="210" height="120" rx="12" fill="#E3ECF5" stroke="#1E4466" stroke-width="2.5"/><text x="155.0" y="163.5" font-size="19" font-weight="700" fill="#1B2430" text-anchor="middle">Lo que hace el niño</text><text x="155.0" y="186.5" font-size="16" font-weight="400" fill="#3A4656" text-anchor="middle">Intentos, tiempos,</text><text x="155.0" y="209.5" font-size="16" font-weight="400" fill="#3A4656" text-anchor="middle">errores y aciertos</text><rect x="300" y="120" width="210" height="120" rx="12" fill="#E3ECF5" stroke="#1E4466" stroke-width="2.5"/><text x="405.0" y="164.5" font-size="21" font-weight="700" fill="#1B2430" text-anchor="middle">Registro</text><text x="405.0" y="187.5" font-size="16" font-weight="400" fill="#3A4656" text-anchor="middle">TelemetryManager</text><text x="405.0" y="210.5" font-size="16" font-weight="400" fill="#3A4656" text-anchor="middle">lo anota al momento</text><rect x="550" y="120" width="220" height="120" rx="12" fill="#FDEBD6" stroke="#F28C28" stroke-width="2.5"/><text x="660.0" y="163.5" font-size="19" font-weight="700" fill="#1B2430" text-anchor="middle">Archivo de la sesión</text><text x="660.0" y="186.5" font-size="16" font-weight="400" fill="#3A4656" text-anchor="middle">PIN_sesión_visor.json</text><text x="660.0" y="209.5" font-size="16" font-weight="400" fill="#3A4656" text-anchor="middle">guardado en el visor</text><path d="M 260 180 L 300 180" fill="none" stroke="#1E4466" stroke-width="2.5" marker-end="url(#a1E4466)"/><path d="M 510 180 L 550 180" fill="none" stroke="#1E4466" stroke-width="2.5" marker-end="url(#a1E4466)"/><rect x="850" y="120" width="320" height="120" rx="12" fill="#1E4466" stroke="#1E4466" stroke-width="2.5"/><text x="1010.0" y="164.5" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">Servidor de Yachay Tech</text><text x="1010.0" y="187.5" font-size="16" font-weight="400" fill="#FFFFFF" text-anchor="middle">datascience.yachaytech.edu.ec</text><text x="1010.0" y="210.5" font-size="16" font-weight="400" fill="#FFFFFF" text-anchor="middle">POST /upload con clave</text><path d="M 770 180 L 850 180" fill="none" stroke="#F28C28" stroke-width="2.5" marker-end="url(#aF28C28)"/><text x="820" y="168" font-size="15" font-weight="400" fill="#F28C28" text-anchor="middle">Wi-Fi</text><rect x="550" y="330" width="220" height="120" rx="12" fill="#EEF1F5" stroke="#5B6675" stroke-width="2.5"/><text x="660.0" y="374.5" font-size="19" font-weight="700" fill="#1B2430" text-anchor="middle">Sesiones pendientes</text><text x="660.0" y="396.5" font-size="15" font-weight="400" fill="#3A4656" text-anchor="middle">Si no hay red, el archivo</text><text x="660.0" y="418.5" font-size="15" font-weight="400" fill="#3A4656" text-anchor="middle">espera en el visor</text><path d="M 660 240 L 660 330" fill="none" stroke="#5B6675" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#a5B6675)"/><text x="700" y="290" font-size="15" font-weight="400" fill="#5B6675" text-anchor="middle">sin red</text><path d="M 770 390 L 1010 390 L 1010 240" fill="none" stroke="#F28C28" stroke-width="2.5" marker-end="url(#aF28C28)"/><text x="985" y="418" font-size="15" font-weight="400" fill="#F28C28" text-anchor="middle">se envían solas al abrir Setup, o con «Subir datos»</text><rect x="50" y="330" width="460" height="120" rx="12" fill="#EEF1F5" stroke="#5B6675" stroke-width="2.5"/><text x="280.0" y="374.5" font-size="21" font-weight="700" fill="#1B2430" text-anchor="middle">Sin Wi-Fi en el aula</text><text x="280.0" y="397.5" font-size="16" font-weight="400" fill="#3A4656" text-anchor="middle">Los archivos se copian por cable USB</text><text x="280.0" y="420.5" font-size="16" font-weight="400" fill="#3A4656" text-anchor="middle">con Meta Quest Developer Hub o adb pull</text><path d="M 550 390 L 510 390" fill="none" stroke="#5B6675" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#a5B6675)"/></svg>