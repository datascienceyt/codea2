<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Arial, Helvetica, sans-serif"><defs><marker id="a1E4466" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1E4466"/></marker><marker id="aF28C28" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F28C28"/></marker><marker id="a5B6675" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5B6675"/></marker><marker id="a2E8B4E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2E8B4E"/></marker></defs><rect width="1200" height="640" fill="#FFFFFF"/><text x="600.0" y="44" font-size="30" font-weight="700" fill="#1E4466" text-anchor="middle">Recorrido de una sesión</text><rect x="30" y="90" width="200" height="150" rx="12" fill="#FDEBD6" stroke="#F28C28" stroke-width="2.5"/><text x="130.0" y="136.5" font-size="21" font-weight="700" fill="#1B2430" text-anchor="middle">Setup</text><text x="130.0" y="160.5" font-size="17" font-weight="400" fill="#3A4656" text-anchor="middle">El supervisor pone</text><text x="130.0" y="184.5" font-size="17" font-weight="400" fill="#3A4656" text-anchor="middle">el PIN y elige la</text><text x="130.0" y="208.5" font-size="17" font-weight="400" fill="#3A4656" text-anchor="middle">dificultad</text><rect x="270" y="90" width="180" height="150" rx="12" fill="#EEF1F5" stroke="#5B6675" stroke-width="2.5"/><text x="360.0" y="136.5" font-size="21" font-weight="700" fill="#1B2430" text-anchor="middle">Tutorial</text><text x="360.0" y="160.5" font-size="17" font-weight="400" fill="#3A4656" text-anchor="middle">Practicar: pulsar,</text><text x="360.0" y="184.5" font-size="17" font-weight="400" fill="#3A4656" text-anchor="middle">encajar y colocar.</text><text x="360.0" y="208.5" font-size="17" font-weight="400" fill="#3A4656" text-anchor="middle">Botón Empezar</text><path d="M 230 165.0 L 270 165.0" fill="none" stroke="#1E4466" stroke-width="2.5" marker-end="url(#a1E4466)"/><path d="M 450 165.0 L 490 165.0" fill="none" stroke="#1E4466" stroke-width="2.5" marker-end="url(#a1E4466)"/><rect x="490" y="70" width="680" height="330" rx="14" fill="none" stroke="#5B6675" stroke-width="2" stroke-dasharray="8 6"/><text x="506" y="96" font-size="18" font-weight="700" fill="#5B6675" text-anchor="start">Juego · reloj de la sesión: 15 minutos, corre solo durante los retos</text><rect x="508" y="112" width="148" height="128" rx="12" fill="#E3ECF5" stroke="#1E4466" stroke-width="2.5"/><text x="582.0" y="150.0" font-size="20" font-weight="700" fill="#1B2430" text-anchor="middle">Sala 1</text><text x="582.0" y="172.0" font-size="15" font-weight="400" fill="#3A4656" text-anchor="middle">Secuencialidad</text><text x="582.0" y="194.0" font-size="15" font-weight="400" fill="#3A4656" text-anchor="middle">Guiar a Roki</text><text x="582.0" y="216.0" font-size="15" font-weight="400" fill="#3A4656" text-anchor="middle">hasta el botón</text><rect x="672" y="112" width="148" height="128" rx="12" fill="#E3ECF5" stroke="#1E4466" stroke-width="2.5"/><text x="746.0" y="150.0" font-size="20" font-weight="700" fill="#1B2430" text-anchor="middle">Sala 2</text><text x="746.0" y="172.0" font-size="15" font-weight="400" fill="#3A4656" text-anchor="middle">Condicionales</text><text x="746.0" y="194.0" font-size="15" font-weight="400" fill="#3A4656" text-anchor="middle">Reparar los</text><text x="746.0" y="216.0" font-size="15" font-weight="400" fill="#3A4656" text-anchor="middle">tres sistemas</text><path d="M 656 176 L 672 176" fill="none" stroke="#1E4466" stroke-width="2.5" marker-end="url(#a1E4466)"/><rect x="836" y="112" width="148" height="128" rx="12" fill="#E3ECF5" stroke="#1E4466" stroke-width="2.5"/><text x="910.0" y="150.0" font-size="20" font-weight="700" fill="#1B2430" text-anchor="middle">Sala 3</text><text x="910.0" y="172.0" font-size="15" font-weight="400" fill="#3A4656" text-anchor="middle">Bucles</text><text x="910.0" y="194.0" font-size="15" font-weight="400" fill="#3A4656" text-anchor="middle">Clasificar la carga</text><text x="910.0" y="216.0" font-size="15" font-weight="400" fill="#3A4656" text-anchor="middle">con el brazo</text><path d="M 820 176 L 836 176" fill="none" stroke="#1E4466" stroke-width="2.5" marker-end="url(#a1E4466)"/><rect x="1000" y="112" width="148" height="128" rx="12" fill="#E3ECF5" stroke="#1E4466" stroke-width="2.5"/><text x="1074.0" y="150.0" font-size="20" font-weight="700" fill="#1B2430" text-anchor="middle">Sala 4</text><text x="1074.0" y="172.0" font-size="15" font-weight="400" fill="#3A4656" text-anchor="middle">Patrones</text><text x="1074.0" y="194.0" font-size="15" font-weight="400" fill="#3A4656" text-anchor="middle">Encontrar la ficha</text><text x="1074.0" y="216.0" font-size="15" font-weight="400" fill="#3A4656" text-anchor="middle">idéntica</text><path d="M 984 176 L 1000 176" fill="none" stroke="#1E4466" stroke-width="2.5" marker-end="url(#a1E4466)"/><rect x="508" y="270" width="644" height="108" rx="12" fill="#DDF4F4" stroke="#1E8E90" stroke-width="2.5"/><text x="830.0" y="308.5" font-size="19" font-weight="700" fill="#1B2430" text-anchor="middle">Máximo 5 minutos por sala</text><text x="830.0" y="330.5" font-size="15" font-weight="400" fill="#3A4656" text-anchor="middle">Resuelta o agotada, se abre la siguiente. Si la sala se agota, queda registrada</text><text x="830.0" y="352.5" font-size="15" font-weight="400" fill="#3A4656" text-anchor="middle">como no resuelta. Si se agotan los 15 minutos, la sesión se cierra.</text><rect x="690" y="450" width="300" height="110" rx="12" fill="#E1F5E6" stroke="#2E8B4E" stroke-width="2.5"/><text x="840.0" y="488.5" font-size="21" font-weight="700" fill="#1B2430" text-anchor="middle">Regreso a la Tierra</text><text x="840.0" y="512.5" font-size="17" font-weight="400" fill="#3A4656" text-anchor="middle">Celebración al completar</text><text x="840.0" y="536.5" font-size="17" font-weight="400" fill="#3A4656" text-anchor="middle">la sala 4</text><path d="M 1100 400 L 1100 505 L 990 505" fill="none" stroke="#1E4466" stroke-width="2.5" marker-end="url(#a1E4466)"/><rect x="330" y="450" width="300" height="110" rx="12" fill="#FDEBD6" stroke="#F28C28" stroke-width="2.5"/><text x="480.0" y="488.5" font-size="21" font-weight="700" fill="#1B2430" text-anchor="middle">Cierre y subida de datos</text><text x="480.0" y="512.5" font-size="17" font-weight="400" fill="#3A4656" text-anchor="middle">Un archivo JSON por</text><text x="480.0" y="536.5" font-size="17" font-weight="400" fill="#3A4656" text-anchor="middle">participante</text><path d="M 690 505 L 630 505" fill="none" stroke="#1E4466" stroke-width="2.5" marker-end="url(#a1E4466)"/><path d="M 330 505 L 130 505 L 130 240" fill="none" stroke="#1E4466" stroke-width="2.5" marker-end="url(#a1E4466)"/><text x="230" y="492" font-size="15" font-weight="400" fill="#1E4466" text-anchor="middle">vuelve a Setup</text><path d="M 560 400 L 560 450" fill="none" stroke="#F28C28" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#aF28C28)"/><text x="628" y="430" font-size="15" font-weight="400" fill="#F28C28" text-anchor="middle">tiempo agotado</text></svg>